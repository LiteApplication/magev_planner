name: Build and push images

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: forgejo.home.liteapp.fr
  IMAGE_BASE: forgejo.home.liteapp.fr/${{ github.repository }}

jobs:
  build:
    runs-on: host
    strategy:
      matrix:
        include:
          - name: backend
            target: production
          - name: frontend
            target: frontend-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to the Forgejo container registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.name }} image
        run: |
          set -eu
          IMAGE="${IMAGE_BASE}-${{ matrix.name }}"
          docker build --target "${{ matrix.target }}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${{ github.sha }}"

      - name: Logout
        if: always()
        run: docker logout "$REGISTRY" || true
