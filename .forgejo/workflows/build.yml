name: Build and push images

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: forgejo.home.liteapp.fr
  IMAGE_BASE: forgejo.home.liteapp.fr/${{ github.repository }}

jobs:
  build:
    runs-on: host
    strategy:
      matrix:
        include:
          - name: backend
            target: production
          - name: frontend
            target: frontend-prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: |
          set -eu
          IMAGE="${IMAGE_BASE}-${{ matrix.name }}"
          buildah build \
            --target "${{ matrix.target }}" \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${{ github.sha }}" \
            -f Dockerfile .

      - name: Log in and push ${{ matrix.name }} image
        env:
          REG_USER: ${{ github.actor }}
          REG_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          IMAGE="${IMAGE_BASE}-${{ matrix.name }}"
          # Login and push in the same step so the auth file is guaranteed to be present.
          echo "$REG_TOKEN" | buildah login -u "$REG_USER" --password-stdin "$REGISTRY"
          buildah push "${IMAGE}:latest"
          buildah push "${IMAGE}:${{ github.sha }}"
          buildah logout "$REGISTRY" || true
