name: Lint

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  lint-frontend:
    runs-on: host
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint frontend
        run: |
          set -eu
          docker run --rm \
            -v "$PWD/web:/app/web" \
            -w /app/web \
            docker.io/library/node:22-alpine \
            sh -c "npm ci && npm run lint"
