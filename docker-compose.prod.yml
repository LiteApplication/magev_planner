services:
  app:
    build:
      context: .
      target: production
    expose:
      - "8000"
    volumes:
      - ./database.db:/app/database.db
      - ./uploads:/app/uploads
    env_file: .env
    restart: unless-stopped

  mailer:
    build:
      context: .
      target: production
    command: uv run mail_daemon
    volumes:
      - ./database.db:/app/database.db
      - ./uploads:/app/uploads
    env_file: .env
    restart: unless-stopped
    depends_on:
      - app

  nginx:
    build:
      context: .
      target: frontend-prod
    ports:
      - "8000:80"
    depends_on:
      - app
    restart: unless-stopped
