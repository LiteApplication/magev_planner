server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads (backend caps each file at 25 MB).
    client_max_body_size 30M;

    # Proxy API calls to the backend. The prefix is preserved (no trailing
    # slash on proxy_pass) because the app declares root_path="/api" and
    # serves its routes under that prefix.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve static assets, otherwise return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
