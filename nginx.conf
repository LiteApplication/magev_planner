server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Allow document uploads (backend caps each file at 25 MB).
    client_max_body_size 30M;

    # Docker's embedded DNS. Combined with a variable in proxy_pass below, this
    # makes nginx re-resolve `app` at request time (every 10s) instead of caching
    # the backend IP once at startup — otherwise a redeployed backend (new Swarm
    # task / VIP) leaves nginx pointing at a dead address and every /api call 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend. The prefix is preserved (no trailing
    # slash / path on proxy_pass) because the app declares root_path="/api" and
    # serves its routes under that prefix. `app` is a variable so the resolver
    # above is actually used for dynamic re-resolution.
    location /api/ {
        set $magev_backend app;
        proxy_pass http://$magev_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: serve static assets, otherwise return index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
