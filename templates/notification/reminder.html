<div>
    <div>Modification de la réservation</div>
    <div style="margin: 6px 0;">{enterprise_message}</div>
    <table style="width: 100%;">
        <tr>
            <td colspan="3">
                <a title="Voir sur Google Maps" href="{maps_link}" style="text-decoration: none; color: #007BFF;">
                    🌍 <strong>{shop}</strong>
                </a>

            </td>
        </tr>
        <tr>
            <td>
                <div>Date : <strong>{datetime-start_time}</strong></div>
                <div>Durée : <strong>{duration}</strong></div>
            </td>
        </tr>
        <tr>
            <td style="text-align: center;">
                <a href="{base_domain}{route}"
                    style="display: inline-block; padding: 10px 20px; background-color: #007BFF; color: white; text-decoration: none; border-radius: 5px;">Voir
                    la réservation</a>
            </td>
        </tr>
    </table>
